version: "2"
linters:
  default: none
  disable:
    - dupl
    - err113
    - exhaustruct
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dupword
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocyclo
    - gocritic
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilnil
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - testifylint
    - usestdlibvars
    - usetesting
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 15
    misspell:
      locale: US
    revive:
      severity: warning
      enable-all-rules: true
      rules:
        - name: add-constant
          exclude:
            - '**/*.go'
        - name: line-length-limit
          arguments: [ 120 ]
        - name: max-public-structs
          arguments: [ 10 ]
    wrapcheck:
      ignore-package-globs:
        - '**/mock'
        - '**/*_test'
  exclusions:
    warn-unused: true
    # Mode of the generated files analysis.
    #
    # - `strict`: sources are excluded by strictly following the Go generated file convention.
    #    Source files that have lines matching only the following regular expression will be excluded: `^// Code generated .* DO NOT EDIT\.$`
    #    This line must appear before the first non-comment, non-blank text in the file.
    #    https://go.dev/s/generatedcode
    # - `lax`: sources are excluded if they contain lines like `autogenerated file`, `code generated`, `do not edit`, etc.
    # - `disable`: disable the generated files exclusion.
    #
    # Default: lax
    generated: strict
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
        - alias
        - blank
      no-inline-comments: true
      no-prefix-comments: true
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
    golines:
      tab-len: 4
      max-len: 120
      chain-split-dots: true
      shorten-comments: false
issues:
  max-issues-per-linter: 10
  max-same-issues: 3
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - severity
    - linter
    - file
  show-stats: true
run:
  timeout: 3m
  relative-path-mode: gomod
  tests: false
  modules-download-mode: readonly
  allow-parallel-runners: false
  allow-serial-runners: false
  go: 1.26.1
  concurrency: 4
