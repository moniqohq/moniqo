version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "queries/users.sql"
      - "queries/auth.sql"
      - "queries/email_jobs.sql"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "generated"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_db_tags: false
        emit_pointers_for_null_types: true
