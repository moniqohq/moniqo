<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none"
     class="w-full max-w-[480px] lg:max-w-none" style="max-height:320px;"
     role="img" aria-label="Blog page illustration">
  <defs>
    <radialGradient id="hg" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10143C"/>
      <stop offset="100%" stop-color="#080B24"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="145" y="27" width="246" height="172" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background glow -->
  <ellipse cx="270" cy="168" rx="240" ry="180" fill="url(#hg)"/>

  <!-- ─── LAPTOP ─── -->
  <!-- Screen frame -->
  <rect x="132" y="14" width="272" height="198" rx="13" fill="#0C0F34" stroke="#1C2358" stroke-width="2"/>
  <!-- Camera dot -->
  <circle cx="268" cy="20" r="3" fill="#181E54"/>
  <!-- Display area -->
  <rect x="145" y="27" width="246" height="172" rx="7" fill="url(#screenGrad)"/>

  <!-- Screen header bar -->
  <rect x="145" y="27" width="246" height="40" rx="7" fill="#0E1240"/>
  <rect x="145" y="51" width="246" height="17" fill="#0E1240"/>
  <!-- BLOG label in header -->
  <rect x="162" y="37" width="44" height="20" rx="10" fill="rgba(124,58,237,.4)"/>
  <text x="170" y="51" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#C084FC" letter-spacing="1">BLOG</text>

  <!-- Featured post image area in screen -->
  <rect x="155" y="77" width="100" height="78" rx="6" fill="#141840"/>
  <!-- Landscape placeholder image -->
  <rect x="155" y="77" width="100" height="78" rx="6" fill="#191E52"/>
  <polygon points="174,148 200,115 226,148" fill="#21286A" clip-path="url(#screenClip)"/>
  <polygon points="212,148 233,122 254,148" fill="#293278" clip-path="url(#screenClip)"/>
  <circle cx="248" cy="96" r="10" fill="#313878" clip-path="url(#screenClip)"/>

  <!-- Category pill on right side -->
  <rect x="264" y="77" width="68" height="18" rx="9" fill="rgba(124,58,237,.28)"/>
  <text x="273" y="90" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#C084FC" letter-spacing="0.5">BUDGETING</text>

  <!-- Post title lines -->
  <rect x="264" y="103" width="118" height="9" rx="4" fill="#1E2455"/>
  <rect x="264" y="119" width="95" height="8" rx="4" fill="#161A45"/>
  <rect x="264" y="134" width="110" height="8" rx="4" fill="#161A45"/>

  <!-- Author row -->
  <circle cx="271" cy="160" r="6.5" fill="#252D68"/>
  <rect x="282" y="156" width="52" height="7" rx="3.5" fill="#1A1F52"/>
  <rect x="339" y="156" width="36" height="7" rx="3.5" fill="#161A45"/>

  <!-- Screen divider -->
  <line x1="155" y1="168" x2="382" y2="168" stroke="#1C2255" stroke-width="1"/>

  <!-- Second post row in screen -->
  <rect x="155" y="176" width="56" height="44" rx="5" fill="#141840"/>
  <rect x="218" y="176" width="102" height="8" rx="4" fill="#1E2455"/>
  <rect x="218" y="191" width="80" height="6" rx="3" fill="#13184A"/>
  <rect x="218" y="204" width="94" height="6" rx="3" fill="#13184A"/>

  <!-- Laptop hinge -->
  <rect x="127" y="212" width="282" height="9" rx="4.5" fill="#0C0F34"/>
  <!-- Laptop base -->
  <rect x="112" y="220" width="312" height="16" rx="6" fill="#090B26"/>
  <!-- Touchpad indent -->
  <rect x="212" y="222" width="122" height="11" rx="3" fill="#060818"/>

  <!-- ─── COFFEE MUG ─── -->
  <!-- Body -->
  <rect x="52" y="183" width="74" height="78" rx="11" fill="#7C3AED"/>
  <!-- Top lip ellipse -->
  <ellipse cx="89" cy="183" rx="37" ry="9.5" fill="#9D6FE8"/>
  <!-- Inner top ellipse (open) -->
  <ellipse cx="89" cy="183" rx="28" ry="6.5" fill="#5B1ED4"/>
  <!-- Bottom ellipse -->
  <ellipse cx="89" cy="261" rx="37" ry="9.5" fill="#4C1D95"/>
  <!-- Handle -->
  <path d="M126 202 Q156 202 156 225 Q156 248 126 248" stroke="#5B21B6" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- M monogram -->
  <text x="72" y="235" font-family="Inter,sans-serif" font-size="30" font-weight="800" fill="white">M</text>
  <!-- Steam wisps -->
  <path d="M79 180 Q83 167 79 155" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" opacity="0.8" fill="none"/>
  <path d="M91 178 Q95 165 91 153" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" opacity="0.75" fill="none"/>
  <path d="M103 180 Q107 167 103 155" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" opacity="0.7" fill="none"/>

  <!-- ─── PLANT ─── -->
  <!-- Pot -->
  <path d="M413 256 L401 294 L454 294 L442 256 Z" fill="#4C1D95"/>
  <!-- Pot rim -->
  <rect x="398" y="249" width="57" height="13" rx="6" fill="#5B21B6"/>
  <!-- Soil -->
  <ellipse cx="427" cy="249" rx="28" ry="7" fill="#3B1580"/>
  <!-- Main stem -->
  <line x1="427" y1="249" x2="427" y2="194" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="405" cy="222" rx="36" ry="14" fill="#10B981" transform="rotate(-38 405 222)"/>
  <ellipse cx="450" cy="227" rx="36" ry="14" fill="#059669" transform="rotate(38 450 227)"/>
  <ellipse cx="414" cy="202" rx="30" ry="13" fill="#34D399" transform="rotate(-24 414 202)"/>
  <ellipse cx="441" cy="197" rx="30" ry="13" fill="#10B981" transform="rotate(28 441 197)"/>
  <ellipse cx="427" cy="186" rx="24" ry="11" fill="#059669" transform="rotate(-3 427 186)"/>
  <!-- Leaf midrib lines -->
  <line x1="405" y1="210" x2="394" y2="236" stroke="#047857" stroke-width="1.5" opacity="0.55" fill="none"/>
  <line x1="450" y1="215" x2="460" y2="240" stroke="#047857" stroke-width="1.5" opacity="0.55" fill="none"/>

  <!-- ─── DECORATIVE STARS ─── -->
  <!-- Large 4-point star top-right -->
  <path d="M497 36 L500 49 L513 52 L500 55 L497 68 L494 55 L481 52 L494 49 Z" fill="#A855F7" opacity="0.88"/>
  <!-- Small sparkle top-left -->
  <path d="M117 33 L119 41 L127 43 L119 45 L117 53 L115 45 L107 43 L115 41 Z" fill="#7C3AED" opacity="0.72"/>
  <!-- Floating dots -->
  <circle cx="62"  cy="118" r="3.5" fill="#C084FC" opacity="0.6"/>
  <circle cx="510" cy="185" r="3"   fill="#A855F7" opacity="0.52"/>
  <circle cx="138" cy="290" r="2.5" fill="#7C3AED" opacity="0.42"/>
  <circle cx="500" cy="115" r="2"   fill="#C084FC" opacity="0.48"/>
  <circle cx="80"  cy="305" r="2"   fill="#A855F7" opacity="0.38"/>
</svg>
