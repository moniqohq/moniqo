<section
  class="relative overflow-hidden"
  style="
    background: linear-gradient(180deg, #050816 0%, #080b1e 60%, #050816 100%);
    min-height: 340px;
  "
>
  {{/* Background decorations */}}
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div class="dot-grid absolute inset-0 opacity-25"></div>
    <div
      class="animate-glow absolute"
      style="
        top: -8%;
        left: 45%;
        transform: translateX(-50%);
        width: 700px;
        height: 600px;
        background: radial-gradient(ellipse, rgba(124, 58, 237, 0.18) 0%, transparent 65%);
        filter: blur(2px);
      "
    ></div>
    <div
      class="absolute"
      style="
        top: 30%;
        right: 8%;
        width: 380px;
        height: 380px;
        background: radial-gradient(ellipse, rgba(79, 70, 229, 0.12) 0%, transparent 70%);
        filter: blur(40px);
      "
    ></div>
  </div>

  <div class="container relative z-10 py-14 lg:py-20">
    <div class="flex flex-col items-center gap-10 lg:flex-row lg:gap-16">
      {{/* Left: text content */}}
      <div class="max-w-lg flex-1">
        <div class="anim-0 mb-5">
          <span class="section-badge">BLOG</span>
        </div>
        <h1
          class="anim-1 mb-5 text-5xl font-extrabold leading-[1.08] text-white lg:text-6xl"
          style="font-family: &quot;Plus Jakarta Sans&quot;, sans-serif"
        >
          Insights for Smarter Budgeting
        </h1>
        <p class="anim-2 mb-9 text-lg leading-relaxed text-gray-400">
          Tips, guides, and updates to help you take control of your money and build a better
          financial life.
        </p>

        {{/* Search */}}
        <div class="anim-3 relative">
          <div class="pointer-events-none absolute inset-y-0 left-4 flex items-center">
            <svg
              class="h-5 w-5 text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"
              />
            </svg>
          </div>
          <input
            type="search"
            id="blog-search"
            placeholder="Search blog posts..."
            autocomplete="off"
            class="w-full rounded-xl py-3.5 pl-12 pr-5 text-sm text-white placeholder-gray-500 outline-none transition-all duration-200"
            style="
              background: rgba(255, 255, 255, 0.06);
              border: 1px solid rgba(255, 255, 255, 0.1);
            "
            onfocus="this.style.borderColor = 'rgba(124,58,237,.6)'"
            onblur="this.style.borderColor = 'rgba(255,255,255,.1)'"
          />
        </div>
      </div>

      {{/* Right: SVG illustration */}}
      <div class="anim-r flex flex-1 select-none justify-center lg:justify-end" aria-hidden="true">
        {{ partial "blog/hero-illustration.html" . }}
      </div>
    </div>
  </div>
</section>
