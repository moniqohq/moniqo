baseURL = "https://moniqo.in/"
title = "Moniqo"
defaultContentLanguage = "en"
theme = "hugo-saasify-theme"

enableEmoji = true
enableGitInfo = true

[taxonomies]
  category = 'categories'
  tag = 'tags'

[pagination]
  pagerSize = 6
  path = "page"

[params]
  description = ""
  author = "Moniqo"
  logo = "/images/logo.svg"

  [params.cta]
    enable = true
    title = "Take Control of Your Money"
    description = "Join people already using Moniqo to budget smarter with the envelope method."
    gradient_from = "#2563eb"
    gradient_to = "#7c3aed"
    gradient_angle = 30
    [params.cta.primary_button]
      text = "Get Started Free"
      url = "/get-started"
    [params.cta.secondary_button]
      text = "Learn More"
      url = "/features"

  [params.social]
    github = "https://github.com/moniqohq/moniqo"

  [params.footer]
    column_1_title = "Features"
    column_2_title = "Company"
    column_3_title = "Legal"

  [params.header]
    background = "bg-white/80 backdrop-blur-sm"
    border = "border-b border-gray-100"
    [params.header.logo]
      src = "/images/logo.svg"
    [params.header.menu]
      spacing = "space-x-8"
      [params.header.menu.dropdown]
        width = "w-72"
        container_padding = "py-6"
        item_padding = "px-8 py-3"
        background = "bg-white"
        border = "border border-gray-100"
        shadow = "shadow-xl"
        radius = "rounded-lg"
        text_color = "text-gray-700"
        hover_background = "hover:bg-gray-50"
        text_size = "text-sm"
    [params.header.buttons]
      [params.header.buttons.signIn]
        text = "Sign in"
        url = "/signin"
      [params.header.buttons.getStarted]
        text = "Get Started"
        url = "/get-started"

  [params.blog]
    enable = true
    title = "Latest Articles"
    subtitle = "Tips, updates, and guides on budgeting and personal finance"
    [params.blog.cta]
      enable = true
    [params.blog.sidebar]
      [params.blog.sidebar.recent]
        enable = true
        title = "Recent Articles"
        count = 5
      [params.blog.sidebar.categories]
        enable = true
        title = "Categories"
      [params.blog.sidebar.tags]
        enable = true
        title = "Popular Tags"
        count = 20

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

[build]
  writeStats = true

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Features"
    url = "/features"
    weight = 2
  [[menu.main]]
    name = "User Guide"
    url = "/user-guide"
    weight = 3
  [[menu.main]]
    name = "Blog"
    url = "/blog"
    weight = 4
  [[menu.main]]
    name = "Contact Us"
    url = "/contact"
    weight = 5

  [[menu.footer_column_1]]
    name = "Features"
    url = "/features"
    weight = 1

  [[menu.footer_column_2]]
    name = "Blog"
    url = "/blog"
    weight = 1

  [[menu.footer_column_3]]
    name = "Privacy Policy"
    url = "/privacy"
    weight = 1
