name: Validate Pull Request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'mergify[bot]'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate commit messages against Conventional Commits spec
        uses: commit-check/commit-check-action@0e0ac2f48ed0d43062a4ab46bf74127e27aab58f # v2
        with:
          message: true
          branch: false
          author-name: true
          author-email: true
          job-summary: false
          dry-run: false
          pr-comments: false

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'mergify[bot]'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check DCO sign-off on all commits
        run: |
          missing=$(git log "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --no-merges --format="%H %s" | while read -r sha msg; do
              author=$(git log -1 --format="%ae" "$sha")
              if echo "$author" | grep -qE "dependabot\[bot\]|mergify\[bot\]|github-actions\[bot\]|noreply@github\.com"; then
                continue
              fi
              if ! git log -1 --format="%B" "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
                echo "  $sha $msg"
              fi
            done)
          if [ -n "$missing" ]; then
            echo "The following commits are missing a Signed-off-by line:"
            echo "$missing"
            echo ""
            echo "Re-run with: git commit --amend --signoff  (last commit)"
            echo "Or:          git rebase --signoff HEAD~N   (last N commits)"
            exit 1
          fi
          echo "All commits have a valid DCO sign-off."

  pr-title:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'mergify[bot]'
    steps:
      - name: Validate PR title against Conventional Commits spec
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            test
            style
            perf
            build
            revert
