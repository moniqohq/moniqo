name: Docker Publish

# Builds and publishes the production backend and web images to Docker Hub.
#
# Triggers:
#   - every push to main (tags images with `latest` + the commit SHA)
#   - every push of a `v*` tag (also tags images with the git tag)
#   - manual dispatch, for re-publishing without a new commit
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

# Cancel superseded runs on main so we never publish out-of-order images.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: moniqo-backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
          - image: moniqo-web
            # Build context is the repo root: the web Dockerfile installs
            # from the pnpm workspace lockfile, which lives there.
            context: .
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags: `latest` on main, the commit SHA always, and the git
      # tag itself when the workflow was triggered by a tag push.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
