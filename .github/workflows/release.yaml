name: Release

# Builds and publishes multi-platform release archives via GoReleaser.
#
# Triggers:
#   - every push of a `vX.Y.Z` tag (same trigger as docker-publish.yml)
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Cancel superseded runs so we never publish out-of-order releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
