name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            frontend:
              - 'apps/web/**'

  build-backend:
    name: build-backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Build backend
        working-directory: apps/backend
        run: go build ./...

  build-frontend:
    name: build-frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install

      - name: Type check web
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

  test-backend:
    name: test-backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Run tests
        working-directory: apps/backend
        run: go test -race -count=1 ./...

  lint-backend:
    name: lint-backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/backend

  lint-frontend:
    name: lint-frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

  format:
    name: format
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

  security-scan:
    name: security-scan
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: apps/backend/go.mod
          work-dir: apps/backend
          repo-checkout: false

  dependency-scan:
    name: dependency-scan
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install

      # continue-on-error: npm registry retired the legacy audit endpoints on 2026-07-15
      # and pnpm audit (all 10.x) hasn't been updated to the new bulk endpoint yet.
      # Remove continue-on-error once https://github.com/pnpm/pnpm/issues/11265 is fixed.
      - name: Audit web dependencies
        working-directory: apps/web
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Audit mobile dependencies
        working-directory: apps/mobile
        run: pnpm audit --audit-level=high
        continue-on-error: true

  license-header:
    name: license-header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check license headers
        uses: apache/skywalking-eyes/header@main
        with:
          mode: check

  summary:
    name: summary
    if: always()
    needs:
      - build-backend
      - build-frontend
      - test-backend
      - lint-backend
      - lint-frontend
      - format
      - security-scan
      - dependency-scan
      - license-header
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required job failed: $result"
              exit 1
            fi
          done
