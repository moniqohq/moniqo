name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Check for go.mod
        id: gomod
        run: |
          [ -f apps/backend/go.mod ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
        working-directory: .

      - uses: actions/setup-go@v5
        if: steps.gomod.outputs.exists == 'true'
        with:
          go-version-file: apps/backend/go.mod
          cache: true

      - name: Build
        if: steps.gomod.outputs.exists == 'true'
        run: go build ./...

      - name: Vet
        if: steps.gomod.outputs.exists == 'true'
        run: go vet ./...

  web-typecheck:
    name: Web — type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm exec tsc --noEmit

  mobile-typecheck:
    name: Mobile — type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check for tsconfig
        id: tsconfig
        run: |
          [ -f tsconfig.json ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.tsconfig.outputs.exists == 'true'

      - uses: actions/setup-node@v4
        if: steps.tsconfig.outputs.exists == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.tsconfig.outputs.exists == 'true'
        run: pnpm install

      - name: Type check
        if: steps.tsconfig.outputs.exists == 'true'
        run: pnpm exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: pnpm install

      - name: Lint (web)
        run: pnpm lint
