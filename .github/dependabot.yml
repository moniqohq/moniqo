version: 2

# Dependabot configuration for the Moniqo monorepo.
#
# Structure: one `updates` entry per manifest directory. Groups within each
# entry bundle related minor/patch changes into a single PR, while major
# updates arrive as individual PRs (they don't match group `update-types`)
# so they can be reviewed deliberately.
#
# npm is special: pnpm workspaces share ONE root pnpm-lock.yaml. Every npm PR
# rewrites that file, so separate `updates` entries per directory produce PRs
# that conflict with each other as soon as one merges. Dependabot also only
# regenerates the lockfile when it runs from the directory that owns it, so a
# `directories` list of workspace members produces PRs that bump package.json
# without touching pnpm-lock.yaml (and fail `pnpm install --frozen-lockfile`).
# The npm entry therefore uses the single root `directory: /`; Dependabot reads
# pnpm-workspace.yaml from there and covers every member package.json.
#
# Adding a new app or package:
#   - npm:  nothing to do here — add it to pnpm-workspace.yaml and adjust
#           `groups` patterns if needed; majors still arrive individually.
#   - other ecosystems: copy the closest existing stanza, change `directory`,
#     adjust `labels` and `groups`.
#   - For large frameworks that require manual migration, add an `ignore` rule.

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # Monitors all workflow files under .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions
    assignees:
      - abdul-saqib
    groups:
      # Bundle all Actions minor/patch bumps into one PR.
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Go — backend application ────────────────────────────────────────────────
  # Monitors apps/backend/go.mod (Echo, pgx, JWT, goose, zap, …).
  - package-ecosystem: gomod
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
    assignees:
      - abdul-saqib
    groups:
      # Runtime and framework dependencies (minor/patch).
      go-dependencies:
        patterns:
          - "github.com/labstack/*"
          - "github.com/jackc/*"
          - "github.com/golang-jwt/*"
          - "github.com/pressly/*"
          - "github.com/joho/*"
          - "github.com/google/uuid"
          - "go.uber.org/*"
          - "golang.org/x/*"
          - "github.com/valyala/*"
          - "github.com/sethvargo/*"
          - "github.com/mfridman/*"
        update-types: ["minor", "patch"]
      # Test helpers grouped separately for easy review.
      go-testing:
        patterns:
          - "github.com/stretchr/testify"
          - "github.com/stretchr/objx"
          - "github.com/davecgh/go-spew"
          - "github.com/pmezard/go-difflib"
          - "github.com/rogpeppe/go-internal"
        update-types: ["minor", "patch"]

  # ── Go — magefiles build tooling ────────────────────────────────────────────
  # Monitors magefiles/go.mod (Mage task runner).
  - package-ecosystem: gomod
    directory: /magefiles
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
    assignees:
      - abdul-saqib
    groups:
      magefiles:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── npm — all pnpm workspace packages (single root lockfile) ───────────────
  # One entry rooted at `/`: Dependabot discovers workspace members from
  # pnpm-workspace.yaml, so a group update is a single PR that bumps the member
  # package.json files and regenerates pnpm-lock.yaml together.
  # Major React / Next.js / Expo / React Native upgrades are blocked here —
  # they require coordinated migration work and must be handled manually.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - javascript
    assignees:
      - abdul-saqib
    ignore:
      # React major versions require manual migration across all apps.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # Next.js major versions require manual migration.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # Expo SDK major upgrades require manual migration.
      - dependency-name: expo
        update-types: ["version-update:semver-major"]
      - dependency-name: expo-*
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      # React Native major upgrades require manual migration.
      - dependency-name: react-native
        update-types: ["version-update:semver-major"]
      - dependency-name: react-native-*
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major"]
    # A dependency joins the FIRST group whose patterns match it, so keep the
    # catch-all `npm-misc` group last. Minor/patch updates always land in some
    # group; majors never match a group and arrive as individual PRs.
    groups:
      # React and Next.js core (minor/patch only — majors blocked above).
      react-nextjs-core:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "next-*"
          - "eslint-config-next"
        update-types: ["minor", "patch"]
      # Expo SDK and all first-party Expo packages.
      expo-ecosystem:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types: ["minor", "patch"]
      # React Native core and community packages.
      react-native-ecosystem:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "@react-navigation/*"
        update-types: ["minor", "patch"]
      # UI primitives, icons, animation, and charting.
      ui-and-styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tailwind-*"
          - "tw-*"
          - "clsx"
          - "class-variance-authority"
          - "cmdk"
          - "lucide-react"
          - "framer-motion"
          - "shadcn"
          - "@base-ui/*"
          - "recharts"
          - "next-themes"
        update-types: ["minor", "patch"]
      # Form handling and runtime validation.
      forms-and-validation:
        patterns:
          - "react-hook-form"
          - "@hookform/*"
          - "zod"
        update-types: ["minor", "patch"]
      # State management and data fetching.
      state-management:
        patterns:
          - "zustand"
          - "@tanstack/*"
        update-types: ["minor", "patch"]
      # TypeScript compiler and ambient type packages.
      typescript-types:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "@types/*"
        update-types: ["minor", "patch"]
      # Linting and formatting tools.
      linting-tooling:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "prettier-plugin-*"
        update-types: ["minor", "patch"]
      # Test runners and utilities (vitest, jest, testing-library, playwright, detox…).
      testing:
        patterns:
          - "vitest"
          - "jest"
          - "jest-*"
          - "@jest/*"
          - "babel-jest"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
          - "cypress"
          - "detox"
        update-types: ["minor", "patch"]
      # Everything else (minor/patch). Keeps stray single-dependency PRs from
      # competing for the shared lockfile.
      npm-misc:
        patterns: ["*"]
        update-types: ["minor", "patch"]
