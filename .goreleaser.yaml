version: 2

project_name: moniqo

# goreleaser clears its dist dir on startup, which would wipe out
# dist/build/web from the make build-web hook below if the two shared a
# directory.
dist: .goreleaser-dist

before:
  hooks:
    - make build-web

builds:
  - id: moniqo-server
    dir: apps/backend
    main: ./cmd/server
    binary: moniqo-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: moniqo-server
    ids: [moniqo-server]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: moniqo-web
    meta: true
    name_template: "moniqo-web_{{ .Version }}"
    formats: [tar.gz]
    files:
      - src: dist/build/web
        dst: .

checksum:
  name_template: checksums.txt
