version: 2

project_name: moniqo-server

builds:
  - id: moniqo-server
    dir: apps/backend
    main: ./cmd/server
    binary: moniqo-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: moniqo-server
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
