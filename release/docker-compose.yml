# Deploys moniqo from the prebuilt images published to Docker Hub, as an
# alternative to running the bin/ + web/ binaries in this archive directly
# (see scripts/start.sh). Set IMAGE_TAG to pin a specific release instead of
# floating on latest.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moniqo}
      POSTGRES_USER: ${POSTGRES_USER:-moniqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moniqo} -d ${POSTGRES_DB:-moniqo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - moniqo

  backend:
    image: docker.io/moniqohq/moniqo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moniqo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-moniqo}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      PORT: "8080"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:?EMAIL_SMTP_HOST is required}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # No dedicated /health route exists yet; a bare TCP check confirms
      # the server is accepting connections on its listen port.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moniqo

  # NOTE: NEXT_PUBLIC_API_URL is baked in at image build time by Next.js (NEXT_PUBLIC_* vars are inlined by webpack).
  # Setting it here only affects server-side code; it cannot repoint client-side requests without rebuilding the image.
  web:
    image: docker.io/moniqohq/moniqo-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - moniqo

volumes:
  db_data:

networks:
  moniqo:
    driver: bridge
