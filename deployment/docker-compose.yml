# Production stack: Cloudflare Tunnel -> Caddy -> web/backend.
#
# cloudflared dials Cloudflare's edge OUTBOUND (no inbound host ports needed) and
# forwards HTTP to Caddy, which routes / -> web and /api/* -> backend. Cloudflare
# terminates public TLS at its edge, so Caddy serves plain HTTP internally.
# web and backend use pre-built images published by
# .github/workflows/docker-publish.yml (docker.io/${DOCKERHUB_USERNAME}/moniqo-{web,backend}),
# so no local build/context is needed here — just `docker compose ... pull` to update.
#
# Nothing on this stack publishes a host port. Run from the repo root:
#   podman-compose -f deployment/docker-compose.yml --env-file deployment/.env up -d
#   # or: docker compose -f deployment/docker-compose.yml --env-file deployment/.env up -d
#
# In the Cloudflare Zero Trust dashboard, point the tunnel's public hostname at
# the origin service: http://caddy:80
name: moniqo-prod

services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    # TUNNEL_TOKEN is read from the environment; keeping it out of the command
    # avoids leaking the secret into the process/argument list.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      caddy:
        condition: service_started
    networks:
      - edge

  caddy:
    image: docker.io/library/caddy:latest # official latest; consider pinning (e.g. caddy:2-alpine)
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro # config, read-only
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - edge

  web:
    # Published by .github/workflows/docker-publish.yml on every push to main.
    # NEXT_PUBLIC_API_URL is baked in at image build time, so switching it
    # here requires a new image, not just a container restart.
    image: docker.io/${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/moniqo-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge

  backend:
    # Published by .github/workflows/docker-publish.yml on every push to main.
    image: docker.io/${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/moniqo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moniqo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-moniqo}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: "8080"
      APP_BASE_URL: https://${DOMAIN:?DOMAIN is required}
      API_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN} # correct env name (config.go reads CORS_ORIGINS)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:?EMAIL_SMTP_HOST is required}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
    healthcheck:
      # No dedicated /health route exists yet; a bare TCP check confirms
      # the server is accepting connections on its listen port.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge # egress: outbound SMTP
      - internal # reach db

  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moniqo}
      POSTGRES_USER: ${POSTGRES_USER:-moniqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moniqo} -d ${POSTGRES_DB:-moniqo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal # DB never joins edge -> no host ports, no egress

volumes:
  db_data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true # no external connectivity; isolates the database
