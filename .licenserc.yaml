  paths-ignore:
    # Dependencies / generated artefacts
    - "node_modules"
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/out/**"

    # Dependency manifests and lock files
    - "**/*.sum"
    - "**/*.lock"
    - "**/package.json"

    # sqlc-generated query files
    - "apps/backend/db/query/**"

    # Email templates — Go text/template files; no built-in {{/* */}} style in license-eye
    - "apps/backend/internal/email/templates/**"

    # shadcn/ui scaffolded components (third-party, MIT)
    - "apps/web/src/components/ui/**"

    # Configuration / data files
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.json"
    - "**/*.env"
    - "**/*.sql"

    # Documentation and legal
    - "**/*.md"
    - "docs/**"
    - "agreements/**"
    - "LICENSE"
    - "NOTICE"

    # CI and tooling config
    - ".github/**"
    - "magefiles/**"
    - "CODEOWNERS"

    # Landing page
    - "apps/landing/**"
  
  comment: never

  language:
    Go:
      extensions:
        - ".go"
      comment_style_id: SlashAsterisk
    GoMod:
      filenames:
        - "go.mod"
      comment_style_id: DoubleSlash

dependency:
  files:
    - go.mod