header:
  license:
    spdx-id: GPL-3.0-only # SPDX identifier for GNU General Public License v3
    copyright-owner: Moniqo
    copyright-year: "2026"

  paths-ignore:
    # Dependencies / generated artefacts
    - "node_modules"
    - "**/node_modules/**"
    - "**/.next/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/out/**"

    # Dependency manifests and lock files
    - "**/*.sum"
    - "**/*.lock"
    - "go.mod"
    - "**/go.mod"
    - "**/package.json"

    # sqlc-generated query files
    - "apps/backend/db/query/**"

    # shadcn/ui scaffolded components (third-party, MIT)
    - "apps/web/src/components/ui/**"

    # Configuration / data files
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.toml"
    - "**/*.json"
    - "**/*.env"
    - "**/*.sql"

    # Documentation and legal
    - "**/*.md"
    - "docs/**"
    - "agreements/**"
    - "LICENSE"
    - "NOTICE"

    # CI and tooling config
    - ".github/**"
    - "magefiles/**"

    # Landing page
    - "apps/landing/**"
