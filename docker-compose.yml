services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moniqo}
      POSTGRES_USER: ${POSTGRES_USER:-moniqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moniqo} -d ${POSTGRES_DB:-moniqo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - moniqo

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - moniqo

  backend:
    profiles: [app]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moniqo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-moniqo}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      PORT: "8080"
      EMAIL_PROVIDER: smtp
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: "1025"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # No dedicated /health route exists yet; a bare TCP check confirms
      # the server is accepting connections on its listen port.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - moniqo

  # NOTE: NEXT_PUBLIC_API_URL is baked in at image build time by Next.js (NEXT_PUBLIC_* vars are inlined by webpack).
  # Setting it here only affects server-side code; pass it as a build arg when building the image for different environments.
  web:
    profiles: [app]
    build:
      # Context is the repo root: the web Dockerfile installs from the
      # pnpm workspace lockfile, which lives there.
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - moniqo

volumes:
  db_data:

networks:
  moniqo:
    driver: bridge
